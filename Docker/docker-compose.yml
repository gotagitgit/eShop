# version: '3.8'

name: eshop

services:
  redis:
    image: redis:latest
    container_name: eshop-redis
    ports:
      - "6379:6379"
    networks:
      - eshop-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    container_name: eshop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - eshop-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  postgres:
    image: ankane/pgvector:latest
    container_name: eshop-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    networks:
      - eshop-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: eshop-opensearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=admin
    networks:
      - eshop-network
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./opensearch/models:/tmp/models
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.0
    container_name: eshop-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://eshop-opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - eshop-network
    depends_on:
      - opensearch
    restart: unless-stopped

networks:
  eshop-network:
    driver: bridge

volumes:
  rabbitmq-data:
  postgres-data:
  opensearch-data:
